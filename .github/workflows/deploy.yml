name: Deploy Web App via Docker

on:
  push:
    branches:
      - reisan_backend # Trigger saat ada push ke branch reisan_backend 
  pull_request:
    branches:
      - reisan_backend

# 🚨 DEFINISIKAN VARIABEL DI LEVEL JOB
env:
  DOCKER_IMAGE_NAME: reipand/showroom_jeep # Ganti dengan format Docker Hub Anda: username/repo-name
  CONTAINER_NAME: php-webserver
  DEPLOY_PORT: 8080 # Port yang digunakan di dalam container
  APP_ENV: production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 🚨 GUNAKAN ENVIRONMENT UNTUK KEAMANAN SECRETS
    # environment: reisan-live # Un-comment baris ini setelah Anda membuat Environment di GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      # 1. BUILD DAN PUSH IMAGE
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: .Dockerfile
          push: true
          # Gunakan nama image dari ENV dan tag dengan nama branch saat ini
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          # Build arguments for production
          build-args: |
            APP_ENV=${{ env.APP_ENV }}

      # 2. DEPLOY KE SERVER VIA SSH
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Tentukan tag yang akan digunakan (menggunakan nama branch)
            IMAGE_TAG=${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "Pulling image ${IMAGE_TAG}..."
            # Pull image terbaru dari Docker Hub
            docker pull $IMAGE_TAG
            
            echo "Stopping and removing old container ${CONTAINER_NAME}..."
            # Hentikan dan hapus container lama. || true agar script tidak berhenti jika container tidak ada.
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            
            echo "Running new container with production environment..."
            # Jalankan container baru dengan environment variables untuk production
            docker run -d \
              -p 8080:80 \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -e APP_ENV=${{ env.APP_ENV }} \
              -e DB_HOST=db \
              -e DB_USER=jeep_user \
              -e DB_PASS=bcst2526 \
              -e DB_NAME=jeep_db \
              $IMAGE_TAG
            
            echo "Deployment complete."
            echo "Application is now running at http://your-server:8080"