name: Deploy Web App via Docker

on:
  push:
    branches:
      - main # Trigger saat ada push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: myapp/webserver:${{ github.sha }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Pull image terbaru dari Docker Hub
            docker pull myapp/webserver:${{ github.sha }}
            # Hentikan dan hapus container lama
            docker stop php-webserver || true
            docker rm php-webserver || true
            # Jalankan container baru
            docker run -d -p 80:80 --name php-webserver myapp/webserver:${{ github.sha }}