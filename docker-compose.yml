services:
  web:
    # Menggunakan custom image yang sudah di-build
    build:
      context: .
      dockerfile: .Dockerfile
    container_name: php-webserver
    restart: unless-stopped
    ports:
      # Akses Website dari Host: http://localhost:8085
      - "8085:80"
    volumes:
      # Mount folder src/ di host ke direktori root dokumen Apache di container
      - /home/reip/Documents/showroom_web/src:/var/www/html
      # Mount database init script
      - ./jeep_db.sql:/docker-entrypoint-initdb.d/jeep_db.sql
      
    # Environment variables untuk koneksi database
    environment:
      - DB_HOST=db
      - DB_USER=jeep_user
      - DB_PASS=bcst2526
      - DB_NAME=jeep_db
    
    # Ketergantungan pada layanan database
    depends_on:
      - db

  db:
    # Menggunakan MariaDB versi terbaru
    image: mariadb:10.7
    container_name: mariadb-server
    restart: unless-stopped
    
    # AKSES LUAR: Port host 3307 diarahkan ke Port 3306 di container.
    ports:
      - "3307:3306" 
      
    # Variabel lingkungan untuk mengkonfigurasi database
    environment:
      MYSQL_DATABASE: jeep_db
      MYSQL_USER: jeep_user
      MYSQL_PASSWORD: bcst2526
      MYSQL_ROOT_PASSWORD: bcst2526
      
    volumes:
      # Penyimpanan data persisten
      - db_data:/var/lib/mysql
      # Mount database initialization script
      - ./jeep_db.sql:/docker-entrypoint-initdb.d/jeep_db.sql

  # 🚨 PERBAIKAN: LAYANAN PHPMYADMIN DIMASUKKAN DI BAWAH 'services:'
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-dashboard
    restart: always
    ports:
      # Akses dari host: http://localhost:8081
      - "8081:80" 
    environment:
      # PMA_HOST harus menggunakan nama layanan (db) BUKAN port (3307)
      PMA_HOST: db 
      # PMA_PORT harus menggunakan port internal container DB (3306)
      PMA_PORT: 3306 
      # Gunakan password root yang sama dengan layanan db
      MYSQL_ROOT_PASSWORD: bcst2526 
    depends_on:
      - db

# Mendefinisikan volume untuk penyimpanan data database
volumes:
  db_data:
