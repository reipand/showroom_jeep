version: '3.8'
services:
  web:
    # Menggunakan image resmi PHP dengan Apache
    image: php:8.2-apache # Ganti versi PHP sesuai kebutuhan
    container_name: php-webserver
    restart: unless-stopped
    ports:
      # Map port 8080 di host (Fedora) ke port 80 di container (port default Apache)
      - "8080:80"
    volumes:
      # Mount folder src/ di host ke direktori root dokumen Apache di container
      - ./src:/var/www/html